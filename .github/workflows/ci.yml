name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - name: Run full regression with timings
        env:
          PYTEST_ADDOPTS: ${{ runner.os == 'Windows' && '-n 2 --dist worksteal' || '-n 0' }}
        run: python -X utf8 -m pytest tests -q --durations=30 --junitxml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ runner.os }}-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: error
